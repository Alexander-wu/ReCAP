name: CPU checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: pip install -e '.[dev]'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src
      - run: python scripts/audit_release.py
      - run: python -m build
      - name: Verify installed wheel outside the source tree
        run: |
          python -m venv /tmp/recap-wheel
          /tmp/recap-wheel/bin/pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/recap-wheel/bin/recap doctor
          /tmp/recap-wheel/bin/python -c "from recap import ReCAPContext; from importlib.resources import files; assert len(ReCAPContext([0]*1280,[0]*93).prompt()) == 1373; assert files('recap').joinpath('reference/bridge_pair.py').is_file()"
